version: "3.7"
# Portainer stack for receivable-wa (standalone WhatsApp Web / Baileys service).
# Variables come from the stack environment; template in stack.env.example.
services:
  whatsapp-baileys:
    container_name: whatsapp-baileys
    hostname: whatsapp-baileys
    image: ghcr.io/raymondsugiarto/receivable-wa:latest
    # No `ports:` on purpose: client systems on the `platform` network call
    # it at http://receivable-wa:4020.
    environment:
      - WA_PORT=4020
      # Same value as WHATSAPP_SIDECAR_SECRET in the receivable-api stack.
      - WA_SIDECAR_SECRET=${WA_SIDECAR_SECRET}
      - WA_API_BASE_URL=${WA_API_BASE_URL:-http://whatsapp-baileys:4011}
      # The service's own database ("whatsapp"), not receivable's.
      - WA_DATABASE_HOST=${WA_DATABASE_HOST}
      - WA_DATABASE_PORT=${WA_DATABASE_PORT:-5432}
      - WA_DATABASE_USERNAME=${WA_DATABASE_USERNAME}
      - WA_DATABASE_PASSWORD=${WA_DATABASE_PASSWORD}
      - WA_DATABASE_DBNAME=${WA_DATABASE_DBNAME:-whatsapp}
      - WA_DATABASE_SCHEMA=${WA_DATABASE_SCHEMA:-public}
      - WA_LOG_LEVEL=${WA_LOG_LEVEL:-info}
    # Exactly one instance: two sidecars on the same WhatsApp login knock
    # each other off ("connection replaced"), so stop the old one first.
    deploy:
      replicas: 1
      update_config:
        order: stop-first
    restart: always
    networks:
      - platform

networks:
  platform:
    external: true
